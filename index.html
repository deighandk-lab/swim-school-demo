<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champions Boxing Gym</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

:root {
  --primary: #e11d48;
  --bg: #ffffff;
  --text: #111;
}

html.dark-mode {
  --bg: #0f172a;
  --text: #f1f5f9;
}

body {
  background: var(--bg);
  color: var(--text);
  transition: 0.3s ease;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 40px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  position: sticky;
  top: 0;
  background: var(--bg);
}

.logo {
  font-weight: 700;
  color: var(--primary);
  text-decoration: none;
  font-size: 22px;
}

nav {
  display: flex;
  gap: 25px;
}

nav a {
  text-decoration: none;
  color: var(--text);
  font-weight: 500;
}

nav a:hover {
  color: var(--primary);
}

.btn {
  padding: 10px 18px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* HERO */
.hero {
  height: 85vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
  url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed') center/cover;
  color: white;
}

.hero h1 {
  font-size: 50px;
  margin-bottom: 15px;
}

.hero p {
  max-width: 600px;
  margin: auto;
  margin-bottom: 20px;
}

/* WATERMARK */
.watermark {
  position: fixed;
  bottom: 15px;
  left: 15px;
  font-size: 12px;
  opacity: 0.4;
}

/* DARK MODE BUTTON */
.toggle {
  background: none;
  border: 1px solid var(--text);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">🥊 Champions Boxing</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="programs.html">Programs</a>
    <a href="contact.html">Contact</a>
  </nav>

  <button class="toggle" onclick="toggleTheme()">🌙</button>
</header>

<section class="hero">
  <div>
    <h1>Train Like a Champion</h1>
    <p>Professional boxing training for beginners, amateurs, and competitive fighters.</p>
    <a href="contact.html"><button class="btn">Join Now</button></a>
  </div>
</section>

<div class="watermark">Animo Holdings ©</div>

<script>
function toggleTheme() {
  document.documentElement.classList.toggle('dark-mode');
}
</script>

</body>
</html>
